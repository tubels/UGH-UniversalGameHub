<html xmlns:th="http://www.thymeleaf.org">
	
<body>
	<h1>All Users</h1>
		<table border="1">
			<tr>
				<th>ID</th>
				<th>Username</th>
				<th>Email</th>
			</tr>
			<tr th:each="user :${package}">
				<td th:text="${user.userId}"></td>
				<td th:text="${user.username}"></td>
				<td th:text="${user.email}"></td>
			</tr>
		</table>
	</body>
</html>
