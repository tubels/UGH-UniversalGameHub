<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<link th:href="@{/css/mystyle.css}" rel="stylesheet">
		<a th:href="@{/crud}">Back to CRUD page</a>
	</head>
	<body>
		<h1>All Genres</h1>
		<table border="1">
			<tr>
				<th>ID</th>
				<th>Name</th>
				<th th:colspan="2">Actions</th>
			</tr>
			<tr th:each="gen : ${package}">
				<td th:text="${gen.genreId}"></td>
				<td th:text="${gen.name}"></td>
				<td>
					<form method="get"
						th:action="@{/genre/crud/update/{id}(id=${gen.genreId})}">
						<button type="submit">
							Update
						</button>
					</form>
				</td>
				<td><form method="get"
						th:action="@{/genre/crud/delete/{id}(id=${gen.genreId})}">
						<button type="submit"
							th:onclick="return confirm('Are you sure you want to delete this entry?')">
							Delete
						</button>
					</form>
				</td>
			</tr>
		</table>
	</body>
</html>
