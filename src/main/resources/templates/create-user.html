<html xmlns:th="http://www.thymeleaf.org">
	
<body>
	<h1>Create User</h1>
	<form method="post"
		th:object="${user}"
		th:action="@{/user/crud/create}">
		
		<table>
			<tr>
				<td>Username:</td>
				<td><input type="text" thd:field="*{username}"></td>
			</tr>
			<tr>
				<td>Email:</td>
				<td><input type="number" th:field="*{email}"></td>
			</tr>

			
			
		</table>
		<button type="submit">
			Save
		</button>
	</form>
</body>
</html>
