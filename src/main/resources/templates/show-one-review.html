<html xmlns:th="http://www.thymeleaf.org">
	
<body>
	<h1>Review Details</h1>
	<p>ID: <span th:text="${package.reviewId}"></span></p>
	<p>Title: <span th:text="${package.title}"></span></p>
	<p>Rating: <span th:text="${package.rating}"></span></p>
	<p>Description: <span th:text="${package.description}"></span></p>
	<p>User: <span th:text="${package.user.username}"></span></p>
	<p>Game: <span th:text="${package.game.title}"></span></p>
</body>
</html>
