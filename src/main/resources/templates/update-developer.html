<html xmlns:th="http://www.thymeleaf.org">
	
<body>
	<h1>Update Developer</h1>
	<form method="post"
		th:object="${developer}"
		th:action="@{/developer/crud/update/__${developer.devId}__}">
		
		<table>
			<tr>
				<td>Name:</td>
				<td><input type="text" thd:field="*{name}"></td>
			</tr>
		</table>
	<button type="submit">
				Save
	</button>
	</form>	
</body>
</html>
