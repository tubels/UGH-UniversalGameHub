<html xmlns:th="http://www.thymeleaf.org">
	
<body>
	<h1>User Game Details</h1>
	<p>ID: <span th:text:="${package.userGameId}"></span></p>
	<p>Game Status: <span th:text="${package.gameStatus}"></span></p>
	<p>User: <span th:text="${package.user.username}"></span></p>
	<p>Game: <span th:text="${package.game.title}"></span></p>	
</body>
</html>
